set default=0
set timeout=5

menuentry "W4 OS Server (Live)" {
    linux /live/vmlinuz boot=live components username=w4live hostname=w4-server-live quiet splash
    initrd /live/initrd
}

menuentry "W4 OS Server (Live, Safe Graphics)" {
    linux /live/vmlinuz boot=live components nomodeset username=w4live hostname=w4-server-live
    initrd /live/initrd
}