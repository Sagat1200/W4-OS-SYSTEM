set default=0
set timeout=5

menuentry "W4 OS Business (Live)" {
    linux /live/vmlinuz boot=live components username=w4live hostname=w4-business-live quiet splash
    initrd /live/initrd
}

menuentry "W4 OS Business (Live, Safe Graphics)" {
    linux /live/vmlinuz boot=live components nomodeset username=w4live hostname=w4-business-live
    initrd /live/initrd
}