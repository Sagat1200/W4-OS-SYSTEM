set default=0
set timeout=5

menuentry "W4 OS Home (Live)" {
    linux /live/vmlinuz boot=live components username=w4live hostname=w4-home-live quiet splash
    initrd /live/initrd
}

menuentry "W4 OS Home (Live, Safe Graphics)" {
    linux /live/vmlinuz boot=live components nomodeset username=w4live hostname=w4-home-live
    initrd /live/initrd
}